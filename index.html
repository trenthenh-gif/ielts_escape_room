<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Escape Room - V5 Fixed</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #00e5ff;
            --danger: #ff2a2a;
            --success: #00e676;
            --text: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Wrapper để gắn hiệu ứng rung và nháy đỏ */
        #game-wrapper {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 30px;
            position: relative;
            overflow: hidden;
            border: 1px solid #333;
            transition: background-color 0.3s;
        }

        /* --- HIỆU ỨNG TRẢ LỜI SAI (ĐÃ SỬA LỖI CHỈ CHẠY 1 LẦN) --- */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-8px, 0); }
            20%, 40%, 60%, 80% { transform: translate(8px, 0); }
        }
        @keyframes flashRed {
            0% { background-color: rgba(255, 42, 42, 0.2); box-shadow: inset 0 0 30px rgba(255, 42, 42, 0.4); }
            100% { background-color: var(--card-bg); box-shadow: inset 0 0 0px rgba(255, 42, 42, 0); }
        }
        
        .shake-effect { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        .flash-red-effect { animation: flashRed 0.5s ease-out both; }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }

        h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-top: 5px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #252525;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .stat-label { font-size: 0.75rem; color: #888; text-transform: uppercase; }
        .hp-hearts { color: var(--danger); font-size: 1.2rem; letter-spacing: 2px; }
        .lock-progress { color: var(--primary); }

        .question-area {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
        }

        .lock-title {
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .options-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #333;
            border: 1px solid #444;
            color: var(--text);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: #444;
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .option-btn.correct {
            background: rgba(0, 230, 118, 0.2);
            border-color: var(--success);
            color: var(--success);
        }

        .option-btn.wrong {
            background: rgba(255, 42, 42, 0.2);
            border-color: var(--danger);
            color: var(--danger);
        }

        .feedback-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .game-over-screen, .win-screen {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .game-over-screen h2 { color: var(--danger); font-size: 2rem; }
        .win-screen h2 { color: var(--success); font-size: 2rem; }

        .restart-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .restart-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- Màn hình chơi game -->
    <div id="game-screen">
        <header>
            <h1>🗝️ IELTS Escape Room</h1>
            <div class="subtitle">Writing & Reading Strategy Challenge</div>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">HP</span>
                <span id="hp-display" class="hp-hearts">❤️❤️❤️❤️</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Score</span>
                <span id="score-display">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Locks</span>
                <span id="lock-display" class="lock-progress">0/6</span>
            </div>
        </div>

        <div class="question-area">
            <div class="lock-title" id="lock-title">Lock 1</div>
            <div class="question-text" id="question-text">Loading...</div>
        </div>

        <div class="options-area" id="options-area">
            <!-- Options will be injected here -->
        </div>
        
        <div class="feedback-msg" id="feedback-msg"></div>
    </div>

    <!-- Màn hình Game Over -->
    <div class="game-over-screen" id="game-over-screen">
        <h2>💀 GAME OVER</h2>
        <p>Bạn đã hết máu. Căn phòng đã nuốt chửng bạn!</p>
        <p>Score: <span id="final-score-lose">0</span></p>
        <button class="restart-btn" onclick="resetGame()">🔄 Chơi lại</button>
    </div>

    <!-- Màn hình Chiến thắng -->
    <div class="win-screen" id="win-screen">
        <h2>🎉 ESCAPED!</h2>
        <p>Bạn đã giải mã thành công và thoát khỏi căn phòng!</p>
        <p>Final Score: <span id="final-score-win">0</span></p>
        <button class="restart-btn" onclick="resetGame()">🔄 Chơi lại</button>
    </div>
</div>

<script>
    // --- DỮ LIỆU 6 Ổ KHÓA (IELTS STRATEGIES) ---
    const locks = [
        {
            title: "Lock 1: Reading Strategy",
            question: "What is the main purpose of 'Skimming' in IELTS Reading?",
            options: [
                "A) To find specific details like dates or names",
                "B) To get the general idea and main topic of the text",
                "C) To check grammar and vocabulary"
            ],
            correctIndex: 1
        },
        {
            title: "Lock 2: True/False/Not Given",
            question: "In a 'True/False/Not Given' question, what does 'Not Given' mean?",
            options: [
                "A) The statement is completely false",
                "B) The text contradicts the statement",
                "C) The information is not mentioned or cannot be found in the text"
            ],
            correctIndex: 2
        },
        {
            title: "Lock 3: Writing Task 1",
            question: "In IELTS Writing Task 1, which paragraph is CRITICAL for a Band 7+ score?",
            options: [
                "A) The Introduction",
                "B) The Overview (summarizing main trends/stages)",
                "C) The Conclusion"
            ],
            correctIndex: 1
        },
        {
            title: "Lock 4: Writing Task 2",
            question: "How many body paragraphs are typically recommended for a Task 2 essay?",
            options: [
                "A) 1 long paragraph",
                "B) 2 or 3 paragraphs",
                "C) 5 paragraphs"
            ],
            correctIndex: 1
        },
        {
            title: "Lock 5: Writing Criteria",
            question: "What does the 'Coherence and Cohesion' criterion assess?",
            options: [
                "A) Your range of vocabulary",
                "B) Grammatical accuracy",
                "C) Logical organization and use of linking words"
            ],
            correctIndex: 2
        },
        {
            title: "Lock 6: Time Management",
            question: "What is the recommended time split for the IELTS Writing test?",
            options: [
                "A) 20 mins for Task 1, 40 mins for Task 2",
                "B) 30 mins for Task 1, 30 mins for Task 2",
                "C) 10 mins for Task 1, 50 mins for Task 2"
            ],
            correctIndex: 0
        }
    ];

    // --- TRẠNG THÁI GAME ---
    let currentLockIndex = 0;
    let maxHP = 4;
    let currentHP = 4;
    let score = 0;
    let isProcessing = false; // Lock input khi đang chuyển câu

    // --- HÀM XỬ LÝ GIAO DIỆN ---
    function updateUI() {
        // 1. Cập nhật HP (Tim)
        let heartsHTML = '';
        for (let i = 0; i < maxHP; i++) {
            heartsHTML += i < currentHP ? '❤️' : '🖤';
        }
        document.getElementById('hp-display').innerHTML = heartsHTML;

        // 2. Cập nhật Score
        document.getElementById('score-display').innerText = score;

        // 3. Cập nhật Locks
        document.getElementById('lock-display').innerText = `${currentLockIndex}/${locks.length}`;
    }

    function loadLock() {
        if (currentLockIndex >= locks.length) {
            winGame();
            return;
        }

        const lock = locks[currentLockIndex];
        document.getElementById('lock-title').innerText = lock.title;
        document.getElementById('question-text').innerText = lock.question;
        
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = '';
        
        lock.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(index, btn);
            optionsArea.appendChild(btn);
        });

        document.getElementById('feedback-msg').style.display = 'none';
        isProcessing = false;
    }

    // --- HÀM XỬ LÝ TRẢ LỜI (ĐÃ SỬA LỖI) ---
    function handleAnswer(selectedIndex, btnElement) {
        if (isProcessing) return;
        isProcessing = true;

        const lock = locks[currentLockIndex];
        const feedback = document.getElementById('feedback-msg');

        if (selectedIndex === lock.correctIndex) {
            // TRẢ LỜI ĐÚNG
            btnElement.classList.add('correct');
            score += 10;
            feedback.innerText = "✅ Correct! Lock opened.";
            feedback.style.color = "var(--success)";
            feedback.style.display = "block";
            
            updateUI();

            setTimeout(() => {
                currentLockIndex++;
                loadLock();
            }, 1200);

        } else {
            // TRẢ LỜI SAI
            btnElement.classList.add('wrong');
            
            // 1. TRỪ MÁU (Fix bug không mất máu)
            currentHP--;
            updateUI();

            // 2. HIỆU ỨNG RUNG & NHÁY ĐỎ (Fix bug chỉ chạy 1 lần)
            triggerWrongEffect();

            feedback.innerText = "❌ Wrong! You lost 1 HP.";
            feedback.style.color = "var(--danger)";
            feedback.style.display = "block";

            // 3. KIỂM TRA GAME OVER
            if (currentHP <= 0) {
                setTimeout(() => gameOver(), 1000);
            } else {
                // Cho phép chọn lại đáp án khác sau 1 giây
                setTimeout(() => {
                    btnElement.classList.remove('wrong');
                    isProcessing = false; 
                }, 1000);
            }
        }
    }

    // --- KỸ THUẬT FIX LỖI HIỆU ỨNG CSS CHỈ CHẠY 1 LẦN ---
    function triggerWrongEffect() {
        const wrapper = document.getElementById('game-wrapper');
        
        // Bước 1: Xóa class cũ đi (nếu có)
        wrapper.classList.remove('shake-effect', 'flash-red-effect');
        
        // Bước 2: Force Reflow (Kỹ thuật bắt buộc để trình duyệt nhận diện việc thêm class mới là một animation mới)
        void wrapper.offsetWidth; 
        
        // Bước 3: Thêm class hiệu ứng vào
        wrapper.classList.add('shake-effect', 'flash-red-effect');
    }

    // Lắng nghe sự kiện animation kết thúc để tự động xóa class, 
    // đảm bảo lần sau gọi triggerWrongEffect() nó vẫn chạy lại từ đầu
    document.getElementById('game-wrapper').addEventListener('animationend', function() {
        this.classList.remove('shake-effect', 'flash-red-effect');
    });

    // --- KẾT THÚC GAME ---
    function gameOver() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'block';
        document.getElementById('final-score-lose').innerText = score;
    }

    function winGame() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('win-screen').style.display = 'block';
        document.getElementById('final-score-win').innerText = score;
    }

    function resetGame() {
        currentLockIndex = 0;
        currentHP = maxHP;
        score = 0;
        
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('win-screen').style.display = 'none';
        
        updateUI();
        loadLock();
    }

    // --- KHỞI CHẠY GAME ---
    window.onload = () => {
        updateUI();
        loadLock();
    };
</script>

</body>
</html>
